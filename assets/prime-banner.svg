<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060B"/>
      <stop offset="50%" stop-color="#070A13"/>
      <stop offset="100%" stop-color="#0B101E"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients for Accents -->
    <linearGradient id="primeLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0D55"/>
      <stop offset="50%" stop-color="#7B2CBF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Perspective Grid Pattern -->
    <pattern id="synthGrid" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 20" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; letter-spacing: 4px; }
  </style>

  <!-- Canvas Base -->
  <rect width="950" height="280" rx="12" fill="url(#bgGrad)" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Cyberpunk Perspective Grid Floor -->
  <g opacity="0.6">
    <rect y="170" width="950" height="110" fill="url(#synthGrid)"/>
    <line x1="0" y1="170" x2="950" y2="170" stroke="url(#primeLaser)" stroke-width="1.5" filter="url(#cyanGlow)" />
  </g>

  <!-- HUD Corner Markers -->
  <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#FF0D55" stroke-width="2" />
  <path d="M 930 40 L 930 20 L 910 20" fill="none" stroke="#00F0FF" stroke-width="2" />
  <path d="M 20 240 L 20 260 L 40 260" fill="none" stroke="#00F0FF" stroke-width="2" />
  <path d="M 930 240 L 930 260 L 910 260" fill="none" stroke="#FF0D55" stroke-width="2" />

  <!-- Telemetry Sub-Labels Top -->
  <text x="35" y="42" class="mono" font-size="9" fill="#FF0D55" letter-spacing="2">SYS_CORE // OPTIMUS_PROTOCOLS</text>
  <text x="760" y="42" class="mono" font-size="9" fill="#00F0FF" letter-spacing="2">MATRIX: SYNCHRONIZED [OK]</text>

  <!-- Center Crest Symbol (Stylized Abstract Autobot Core Matrix) -->
  <g transform="translate(475, 80)">
    <!-- Outer Diamond Conduit -->
    <polygon points="0,-45 40,0 0,45 -40,0" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.4"/>
    <polygon points="0,-32 28,0 0,32 -28,0" fill="none" stroke="#FF0D55" stroke-width="1.8" filter="url(#redGlow)"/>
    <!-- Core Spark -->
    <circle cx="0" cy="0" r="8" fill="#00F0FF" filter="url(#cyanGlow)"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    <!-- Lateral Energy Wings -->
    <line x1="-40" y1="0" x2="-120" y2="0" stroke="url(#primeLaser)" stroke-width="1.5" />
    <line x1="40" y1="0" x2="120" y2="0" stroke="url(#primeLaser)" stroke-width="1.5" />
  </g>

  <!-- Main Hero Title -->
  <text x="475" y="152" text-anchor="middle" class="display" font-size="34" fill="#FFFFFF">
    THE <tspan fill="#FF0D55">007</tspan> <tspan fill="#00F0FF">PRIME</tspan>
  </text>

  <!-- Secondary Cyber Subtitle -->
  <text x="475" y="182" text-anchor="middle" class="mono" font-size="12" fill="#E2E8F0" letter-spacing="5">
    AI ARCHITECT // CYBERNETIC RESEARCHER // AUTONOMOUS SYSTEMS
  </text>

  <!-- Bottom Terminal Status Bar -->
  <rect x="180" y="215" width="590" height="28" rx="4" fill="#070A13" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="205" cy="229" r="4" fill="#00F0FF" filter="url(#cyanGlow)"/>
  <text x="220" y="233" class="mono" font-size="10" fill="#8A99AD" letter-spacing="1.5">
    STATUS: <tspan fill="#00F0FF">ONLINE</tspan> | CORE: <tspan fill="#FF0D55">LEARNING BY BUILDING</tspan> | DIRECTIVE: <tspan fill="#FFFFFF">PRIME</tspan>
  </text>
</svg>
