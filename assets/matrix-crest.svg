<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0D55"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="crestGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Shield Base -->
  <polygon points="50,5 92,25 92,68 50,95 8,68 8,25" fill="#070A13" stroke="url(#crestGrad)" stroke-width="2.5" filter="url(#crestGlow)"/>

  <!-- Autobot Geometric Face Pattern -->
  <!-- Forehead crest -->
  <polygon points="50,18 42,32 58,32" fill="#FF0D55"/>
  <!-- Central Brow & Nose -->
  <polygon points="45,36 55,36 53,52 47,52" fill="#00F0FF"/>
  <!-- Left Eye & Cheek Plate -->
  <polygon points="26,35 40,35 36,48 24,44" fill="#00F0FF"/>
  <polygon points="22,48 34,51 30,68 20,60" fill="#FF0D55"/>
  <!-- Right Eye & Cheek Plate -->
  <polygon points="74,35 60,35 64,48 76,44" fill="#00F0FF"/>
  <polygon points="78,48 66,51 70,68 80,60" fill="#FF0D55"/>
  <!-- Mouth Plate / Mask -->
  <polygon points="43,56 57,56 54,74 46,74" fill="#00F0FF"/>
  <polygon points="36,76 64,76 50,86" fill="#FF0D55"/>
</svg>
